<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account — ORÈVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div class="container section--tight">

    <div id="guest-view">
      <div class="u-center">
        <span class="eyebrow" style="justify-content:center;">Welcome</span>
        <h2 class="u-mt-1">Your Account</h2>
      </div>

      <div class="auth-card u-mt-4">
        <div class="auth-tabs">
          <button type="button" class="is-active" data-tab="login">Sign In</button>
          <button type="button" data-tab="register">Create Account</button>
        </div>

        <form id="login-form">
          <div class="form-field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" required autocomplete="email">
          </div>
          <div class="form-field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" required autocomplete="current-password">
          </div>
          <button class="btn btn--brass btn--full" type="submit">Sign In</button>
        </form>

        <form id="register-form" hidden>
          <div class="form-field">
            <label for="reg-name">Full name</label>
            <input id="reg-name" type="text" required autocomplete="name">
          </div>
          <div class="form-field">
            <label for="reg-email">Email</label>
            <input id="reg-email" type="email" required autocomplete="email">
          </div>
          <div class="form-field">
            <label for="reg-password">Password</label>
            <input id="reg-password" type="password" required autocomplete="new-password" minlength="6">
          </div>
          <button class="btn btn--brass btn--full" type="submit">Create Account</button>
        </form>

        <div class="divider-or">or</div>
        <button class="btn btn--google btn--full" id="google-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.9 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 27 36 24 36c-5.2 0-9.6-3.1-11.3-7.9l-6.6 5C9.6 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.4 4.4-4.5 5.9l6.6 5.4C40.4 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Continue with Google
        </button>
        <button class="btn btn--ghost btn--full u-mt-2" id="guest-btn" type="button">Continue browsing as guest</button>
      </div>
    </div>

    <div id="user-view" hidden>
      <div class="account-layout">
        <nav class="account-nav" aria-label="Account">
          <ul>
            <li><a href="account.html" aria-current="page">Overview</a></li>
            <li><a href="my-orders.html">My Orders</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
            <li><a href="track-order.html">Track Order</a></li>
          </ul>
          <button class="btn btn--outline btn--sm u-mt-3" id="logout-btn" style="width:100%;">Sign out</button>
        </nav>
        <div>
          <div class="profile-card">
            <div class="profile-avatar" id="profile-avatar">•</div>
            <div>
              <p style="font-weight:700;" id="profile-name">—</p>
              <p class="u-muted" style="font-size:.85rem;" id="profile-email">—</p>
            </div>
          </div>
          <div class="u-flex" style="gap:1rem; flex-wrap:wrap;">
            <a href="my-orders.html" class="btn btn--outline">View my orders</a>
            <a href="wishlist.html" class="btn btn--outline">View wishlist</a>
            <a href="shop.html" class="btn btn--brass">Continue shopping</a>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import "./js/app.js";
  import { toast, onUserReady } from "./js/app.js";
  import { registerWithEmail, loginWithEmail, loginWithGoogle, continueAsGuest, friendlyAuthError } from "./js/auth.js";
  import { db, doc, getDoc } from "./js/firebase-config.js";

  document.querySelectorAll(".auth-tabs button").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".auth-tabs button").forEach((t) => t.classList.remove("is-active"));
      tab.classList.add("is-active");
      document.getElementById("login-form").hidden = tab.dataset.tab !== "login";
      document.getElementById("register-form").hidden = tab.dataset.tab !== "register";
    });
  });

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await loginWithEmail(document.getElementById("login-email").value, document.getElementById("login-password").value);
      toast("Welcome back!", "success");
    } catch (err) {
      toast(friendlyAuthError(err), "error");
    }
  });

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await registerWithEmail(
        document.getElementById("reg-email").value,
        document.getElementById("reg-password").value,
        document.getElementById("reg-name").value
      );
      toast("Account created!", "success");
    } catch (err) {
      toast(friendlyAuthError(err), "error");
    }
  });

  document.getElementById("google-btn").addEventListener("click", async () => {
    try {
      await loginWithGoogle();
      toast("Welcome!", "success");
    } catch (err) {
      toast(friendlyAuthError(err), "error");
    }
  });

  document.getElementById("guest-btn").addEventListener("click", async () => {
    try {
      await continueAsGuest();
      window.location.href = "shop.html";
    } catch (err) {
      toast(friendlyAuthError(err), "error");
    }
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    const { logout } = await import("./js/app.js");
    logout();
  });

  onUserReady(async (user) => {
    const guestView = document.getElementById("guest-view");
    const userView = document.getElementById("user-view");
    if (user && !user.isAnonymous) {
      guestView.hidden = true;
      userView.hidden = false;
      let profileName = user.displayName || "";
      let email = user.email || "";
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          profileName = snap.data().profileName || profileName;
        }
      } catch {}
      document.getElementById("profile-name").textContent = profileName || "ORÈVA customer";
      document.getElementById("profile-email").textContent = email;
      document.getElementById("profile-avatar").textContent = (profileName || email || "O").charAt(0).toUpperCase();
    } else {
      guestView.hidden = false;
      userView.hidden = true;
    }
  });
</script>
</body>
</html>
