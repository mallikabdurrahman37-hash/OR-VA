<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Orders — ORÈVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div class="container section--tight">
    <div class="account-layout">
      <nav class="account-nav" aria-label="Account">
        <ul>
          <li><a href="account.html">Overview</a></li>
          <li><a href="my-orders.html" aria-current="page">My Orders</a></li>
          <li><a href="wishlist.html">Wishlist</a></li>
          <li><a href="track-order.html">Track Order</a></li>
        </ul>
      </nav>
      <div>
        <span class="eyebrow">Account</span>
        <h2 class="u-mt-1">My Orders</h2>
        <div id="orders-mount" class="u-mt-3 stack"></div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import "./js/app.js";
  import { formatINR, formatDate, onUserReady } from "./js/app.js";
  import { fetchOrdersForUser, stageIndexForStatus } from "./js/orders.js";

  const mount = document.getElementById("orders-mount");

  function statusPillClass(order) {
    if (order.cancelled) return "status-pill--cancelled";
    const s = stageIndexForStatus(order.orderStatus);
    return ["status-pill--placed", "status-pill--confirmed", "status-pill--shipped", "status-pill--out", "status-pill--delivered"][s];
  }

  onUserReady(async (user) => {
    if (!user || user.isAnonymous) {
      mount.innerHTML = `
        <div class="empty-state">
          <p>Sign in to view your order history.</p>
          <a href="account.html" class="btn btn--brass btn--sm">Sign in</a>
        </div>`;
      return;
    }
    mount.innerHTML = `<div class="page-loader"><span class="spinner"></span> Loading your orders…</div>`;
    const orders = await fetchOrdersForUser(user.uid);
    if (!orders.length) {
      mount.innerHTML = `
        <div class="empty-state">
          <p>You haven't placed any orders yet.</p>
          <a href="shop.html" class="btn btn--brass btn--sm">Start shopping</a>
        </div>`;
      return;
    }
    mount.innerHTML = orders
      .map(
        (o) => `
      <a href="order-details.html?id=${o.id}" class="order-card">
        <div class="order-card__top">
          <div>
            <div class="order-card__id">Order #${o.id.slice(0, 8).toUpperCase()}</div>
            <div class="order-card__date">${formatDate(o.orderDate)} · ${formatINR(o.totalAmount)}</div>
          </div>
          <span class="status-pill ${statusPillClass(o)}">${o.cancelled ? "Cancelled" : o.orderStatus || "Order Placed"}</span>
        </div>
        <div class="order-card__thumbs">
          ${(o.items || []).slice(0, 5).map((i) => `<img src="${i.image || ""}" alt="${i.name || ""}">`).join("")}
        </div>
      </a>`
      )
      .join("");
  });
</script>
</body>
</html>
