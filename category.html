<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="doc-title">Category — ORÈVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span> <a href="shop.html">Shop</a><span>/</span> <span id="crumb-cat">Category</span></nav>
  </div>

  <div class="container section--tight" style="padding-top:0;">
    <div class="section-head">
      <div>
        <span class="eyebrow">Category</span>
        <h2 id="cat-heading">—</h2>
      </div>
    </div>
    <div class="toolbar">
      <span class="u-muted" id="result-count" style="font-size:.85rem;"></span>
      <select class="select" id="sort-select" aria-label="Sort products">
        <option value="new">Newest</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <div class="product-grid u-mt-3" id="product-grid"></div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import "./js/app.js";
  import { fetchByCategory, productCardHTML, bindWishButtons, skeletonGrid, emptyStateHTML } from "./js/products.js";

  const grid = document.getElementById("product-grid");
  grid.innerHTML = skeletonGrid(8);

  const params = new URLSearchParams(window.location.search);
  const name = params.get("name") || "";
  document.getElementById("cat-heading").textContent = name || "Category";
  document.getElementById("crumb-cat").textContent = name || "Category";
  document.getElementById("doc-title").textContent = `${name || "Category"} — ORÈVA`;

  let items = [];
  const sortSelect = document.getElementById("sort-select");
  const resultCount = document.getElementById("result-count");

  function render() {
    let list = [...items];
    const mode = sortSelect.value;
    if (mode === "price-asc") list.sort((a, b) => a.price - b.price);
    else if (mode === "price-desc") list.sort((a, b) => b.price - a.price);
    else if (mode === "name") list.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    resultCount.textContent = `${list.length} product${list.length === 1 ? "" : "s"}`;
    grid.innerHTML = list.length ? list.map(productCardHTML).join("") : emptyStateHTML(`No products in "${name}" yet.`);
    bindWishButtons(grid);
  }
  sortSelect.addEventListener("change", render);

  (async () => {
    items = name ? await fetchByCategory(name) : [];
    render();
  })();
</script>
</body>
</html>
